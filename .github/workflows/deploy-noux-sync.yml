name: Deploy NOUX encrypted sync
on:
  push:
    branches: [main]
    paths:
      - cloudflare/sync-worker.js
      - cloudflare/wrangler-sync.toml
      - .github/workflows/deploy-noux-sync.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noux-sync-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify configured Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN in Actions secrets'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID in Actions secrets'; exit 1; }
      - name: Validate Worker, conflict handling and browser pairing
        run: |
          node scripts/test_sync_worker.mjs
          node scripts/test_sync_core.js
          node scripts/test_sync_client.js
          node scripts/test_unlock_recovery.js
      - name: Deploy isolated encrypted sync Worker (not the MTA proxy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config cloudflare/wrangler-sync.toml
      - name: Verify sync Worker health
        run: |
          URL="https://noux-sync.benjbongard.workers.dev/health"
          echo "Checking $URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 20 "$URL"
