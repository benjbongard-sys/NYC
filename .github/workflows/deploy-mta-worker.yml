name: Deploy official MTA realtime proxy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare connection
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'To enable live subway arrivals, add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub > Settings > Secrets and variables > Actions.'
            echo 'This deployment intentionally stops until your Cloudflare account is authorised.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Deploy MTA Worker (upstream is public; no MTA key required)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config cloudflare/wrangler.toml