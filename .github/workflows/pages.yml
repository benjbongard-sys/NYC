name: Build, download verified photographs, and publish NYC planner
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build self-hosted React 18 bundles
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npm test
          mkdir -p lib
          cp node_modules/react/umd/react.production.min.js lib/react.min.js
          cp node_modules/react-dom/umd/react-dom.production.min.js lib/react-dom.min.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validator
        run: pip install Pillow==11.3.0
      - name: Download and bundle real place photos
        run: python scripts/fetch_photos.py
      - name: Report photo integrity
        run: |
          python - <<'PY'
          import json
          p=json.load(open('assets/photo-index.json'))
          ok=[k for k,v in p.items() if v.get('path')]
          print('Bundled and validated photo IDs:',', '.join(ok))
          assert len(ok)>=8,'Less than 8 usable photos; no pictureless publication'
          PY
      - name: Collect only public website assets (never publish Git metadata or development scripts)
        run: |
          mkdir -p _site
          cp index.html styles.css app.js data.js itinerary.js mta.js photo-sources.js manifest.webmanifest .nojekyll _site/
          cp -a lib assets _site/
          printf 'Unzip this folder and open index.html. Real photographs are bundled locally.\n' > _site/START_HERE.txt
          echo "Contents of the deployed website:" && find _site -maxdepth 3 -type f | sort | head -60
      - name: Preserve complete photo-built website even when Pages is not yet enabled
        uses: actions/upload-artifact@v4
        with:
          name: nyc-lyna-photographic-website
          path: _site
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4