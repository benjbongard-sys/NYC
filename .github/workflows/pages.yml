name: Publish encrypted NOUX planner with verified photography
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle React dependencies without storing private itinerary source
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          mkdir -p lib
          cp node_modules/react/umd/react.production.min.js lib/react.min.js
          cp node_modules/react-dom/umd/react-dom.production.min.js lib/react-dom.min.js
          cp node_modules/leaflet/dist/leaflet.js lib/leaflet.js
          cp node_modules/leaflet/dist/leaflet.css lib/leaflet.css
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validator
        run: pip install Pillow==11.3.0
      - name: Fetch and validate original venue photography
        run: python scripts/fetch_photos.py
      - name: Construct publication package with encrypted itinerary ONLY
        env:
          MTA_PROXY_URL: ${{ vars.MTA_PROXY_URL }}
        run: |
          mkdir -p _site
          cp index.html unlock.js styles.css manifest.webmanifest robots.txt .nojekyll _site/
          cp -a lib assets _site/
          node -e 'require("fs").writeFileSync("_site/worker-config.js", "window.NYC_MTA_PROXY_URL = " + JSON.stringify(process.env.MTA_PROXY_URL || "") + ";\n")'
          python scripts/check_public.py
          echo 'Encrypted website assets:'
          find _site -maxdepth 2 -type f | sort | head -70
      - name: Save independent fully illustrated offline artifact
        uses: actions/upload-artifact@v4
        with:
          name: noux-private-nyc-site
          path: _site
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4